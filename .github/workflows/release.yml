# Release (Sub-plan 5 Task 2.4): on a v* tag, builds gui/helper
# (nice-dns-helper) for each platform an install fetches it for, writes each
# binary's .sha256, and attaches them all to the GitHub release of that tag.
# scripts/update-assets-lock.sh --write then pins them in
# release/assets.lock (docs/release-inputs.md). Actions are pinned by SHA.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: build ${{ matrix.asset }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: nice-dns-helper-linux-amd64
          - runner: ubuntu-24.04-arm
            asset: nice-dns-helper-linux-arm64
          - runner: macos-15
            asset: nice-dns-helper-macos-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          command -v cargo >/dev/null 2>&1 || {
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
          }
      - name: Test
        run: cargo test --locked --manifest-path gui/helper/Cargo.toml
      - name: Build
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          cargo build --release --locked --manifest-path gui/helper/Cargo.toml
          mkdir -p dist
          cp gui/helper/target/release/nice-dns-helper "dist/$ASSET"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$ASSET" >"$ASSET.sha256"; else shasum -a 256 "$ASSET" >"$ASSET.sha256"; fi
          cat "$ASSET.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Check the hashes
        working-directory: dist
        run: |
          ls -l
          [ "$(find . -maxdepth 1 -name 'nice-dns-helper-*.sha256' | wc -l)" -eq 3 ] || { echo "expected 3 assets" >&2; exit 1; }
          sha256sum -c nice-dns-helper-*.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" --repo "$REPO" --verify-tag --generate-notes dist/nice-dns-helper-*
