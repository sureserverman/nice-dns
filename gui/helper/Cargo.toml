[package]
name = "nice-dns-helper"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Privileged helper for the nice-dns GUI: validates, scrubs, then execs the root-held root-ops"
publish = false

[dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
overflow-checks = true

[profile.dev]
panic = "abort"
overflow-checks = true
