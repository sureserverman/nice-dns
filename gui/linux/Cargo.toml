[package]
name = "nice-dns-gui"
version = "0.2.0"
edition = "2021"
rust-version = "1.77"
description = "GTK4/libadwaita desktop GUI for nice-dns on Linux; reads only the nice-dns command contract"
publish = false

[dependencies]
glib = "0.20"
gtk4 = { version = "0.9", features = ["v4_14"] }
libadwaita = { version = "0.7", features = ["v1_5"] }

[[bin]]
name = "nice-dns-gui"
path = "src/main.rs"

[profile.release]
overflow-checks = true
lto = "thin"
strip = "symbols"
panic = "abort"
