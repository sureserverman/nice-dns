server:
    # If no logfile is specified, syslog is used
    # logfile: "/etc/unbound/unbound.log"
    verbosity: 1
    interface: 127.0.0.1
    # Pi-hole, Unbound, and the Tor proxy share the pod network namespace.
    # Restrict Unbound to pod-local loopback; nothing outside the pod should
    # query this resolver directly.
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    port: 5335
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    # The Tor proxy runs in the same pod network namespace, so the upstream
    # DNS-over-TLS endpoint is intentionally on localhost.
    do-not-query-localhost: no
    # May be set to yes if you have IPv6 connectivity
    do-ip6: no
    # You want to leave this to no unless you have *native* IPv6. With 6to4 and
    # Terredo tunnels your web browser should favor IPv4 for the same reasons
    prefer-ip6: no
    # Use this only when you downloaded the list of primary root servers!
    # If you use the default dns-root-data package, unbound will find it automatically
    #root-hints: "/var/lib/unbound/root.hints"
    # Trust glue only if it is within the server's authority
    harden-glue: yes
    # Require DNSSEC data for trust-anchored zones, if such data is absent, the zone becomes BOGUS
    harden-dnssec-stripped: yes
    # Prevent DNSSEC algorithm downgrade attacks
    harden-algo-downgrade: yes
    # Reject unknown records in additional sections to prevent cache poisoning
    harden-unknown-additional: yes
    # Don't use Capitalization randomization as it known to cause DNSSEC issues sometimes
    # see https://discourse.pi-hole.net/t/unbound-stubby-or-dnscrypt-proxy/9378 for further details
    use-caps-for-id: no
    # Hide resolver identity and version from queries
    hide-identity: yes
    hide-version: yes
    # Reduce EDNS reassembly buffer size.
    # Suggested by the unbound man page to reduce fragmentation reassembly problems
    edns-buffer-size: 1472
    # Perform prefetching of close to expired message cache entries
    # This only applies to domains that have been frequently queried
    prefetch: yes
    # One thread should be sufficient, can be increased on beefy machines. In reality for most users running on small networks or on a single machine, it should be unnecessary to seek performance enhancement by increasing num-threads above 1.
    num-threads: 1
    # Use system default socket buffer sizes (container lacks permissions to override)
    so-rcvbuf: 0
    # Hold the outgoing DoT TCP connection to haproxy (which proxies to the
    # .onion or to backup over Tor) idle for 120s before tearing it down.
    # Default is 30s, which means every query after a 30s idle gap pays a
    # full TLS handshake through Tor again — the dominant cost of the cold
    # vs warm latency gap. Paired with haproxy `timeout client/server 180s`
    # so haproxy doesn't close the upstream-side TCP first.
    tcp-idle-timeout: 120000
    # Pool of outgoing TCP connections. Default is 10; pinned here to make
    # the value visible and prevent silent reduction. With a single upstream
    # (haproxy) 10 is plenty.
    outgoing-num-tcp: 10
    # Reduce time unbound remembers a server as unreachable (default 900s).
    # Prevents long SERVFAIL caching when upstream starts after unbound.
    # Set to 5s: there's a single upstream (haproxy in the same pod), so the
    # usual concerns (EDNS reprobe overhead, suboptimal server selection)
    # don't apply, and a haproxy primary flap recovers in seconds instead
    # of 30s. serve-expired below covers the user-visible gap.
    infra-host-ttl: 5
    # Floor for the dynamic retransmit timeout (default 50ms).
    #
    # The upstream here is a .onion reached over Tor: a cold round trip costs
    # 12-25s, against ~1.5s once circuits and caches are warm. Unbound sizes
    # its upstream timeout from a learned RTT estimate that starts sub-second
    # and adapts upward — but infra-host-ttl above expires that estimate every
    # 5s, so it never survives long enough to learn how slow this upstream is.
    # The result was that unbound abandoned each connection at ~3s while the
    # answer was still in flight: haproxy logged the reply arriving at 17-22s
    # on a socket nobody was reading, and every cold lookup failed.
    #
    # Flooring the estimate fixes that without touching infra-host-ttl, which
    # is set low deliberately so a haproxy primary flap recovers in seconds.
    infra-cache-min-rtt: 15000
    # Send minimum necessary query labels to upstream (defense in depth)
    qname-minimisation: yes
    # Strip unnecessary authority/additional sections from responses
    minimal-responses: yes
    # Cache tuning
    msg-cache-size: 16m
    rrset-cache-size: 32m
    neg-cache-size: 2m
    # Serve-expired: during post-wake Tor circuit rebuild the upstream path is
    # unreachable for up to several minutes. Return stale answers immediately
    # (up to 24h old) and refresh in the background, so clients like the macOS
    # App Store don't time out while Tor reattaches to its bridges.
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800
    # Ensure privacy of local IP ranges
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10

    tls-cert-bundle: "/etc/ssl/cert.pem"
# ---------------------------------------------------------------------------------------------
# DNS over TLS
# ---------------------------------------------------------------------------------------------
forward-zone:
    name: .
    forward-tls-upstream: yes

    forward-addr: 127.0.0.1@853#tor.cloudflare-dns.com
# ---------------------------------------------------------------------------------------------
# Remote control
# ---------------------------------------------------------------------------------------------
# Loopback-only, mutual-TLS-authenticated admin channel. The pod publishes
# 53/80/443/853 outward — port 8953 stays inside the pod netns, reachable
# only from peer containers (pi-hole, tor-haproxy). The keypair below is
# baked into the base image (sureserver/hardened-unbound) at build time;
# no per-instance generation needed.
#
# Primary use cases:
#   - `unbound-control flush_bogus` — clear stuck DNSSEC-BOGUS msg-cache
#     entries that get into a self-refreshing loop (val-bogus-ttl + serve-
#     expired), without dropping the warm positive cache that a full
#     restart would lose.
#   - `unbound-control verbosity 5` — live-toggle query-trace logging for
#     diagnostics, without rebuild or restart. Toggle back to 1 when done.
#   - `unbound-control stats_noreset` — observe bogus / cachemiss / servfail
#     counters to confirm whether re-poisoning is still occurring.
remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953
    server-key-file:   "/etc/unbound/unbound_server.key"
    server-cert-file:  "/etc/unbound/unbound_server.pem"
    control-key-file:  "/etc/unbound/unbound_control.key"
    control-cert-file: "/etc/unbound/unbound_control.pem"
   
