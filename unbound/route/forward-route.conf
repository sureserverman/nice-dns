# nice-dns managed route include (lib/recovery.sh renders this file; do not edit)
# route	cloudflare-legacy
# generation	0
#
# Image default: the legacy :853 endpoint, the route before Sub-plan 2, so an
# image paired with an older proxy keeps resolving. Hosts select an
# identity-bound route from routes/providers.tsv with apply_route, which
# replaces this file inside the directory mounted at /etc/unbound/route.
# The macOS installers rewrite 127.0.0.1 to the proxy container address.
server:
    local-zone: "nice-dns-route.invalid." static
    local-data: 'nice-dns-route.invalid. 0 IN TXT "route=cloudflare-legacy generation=0"'
forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-first: no
    forward-addr: 127.0.0.1@853#tor.cloudflare-dns.com
