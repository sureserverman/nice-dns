# Control-only configuration for unbound-control
# (/usr/share/nice-dns/control.conf). unbound-control parses its config file
# to find the socket. Given the main config, one broken include would lock
# management out. This file names only the socket; the server keeps its own.
remote-control:
    control-enable: yes
    control-interface: /run/unbound/control.sock
    control-use-cert: no
