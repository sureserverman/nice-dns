# Drop-in for pi-hole.container with the hardened image (pihole-hardened/
# Containerfile on the sibling pi-hole-hardened base); installed by
# persistent-podman.sh as pi-hole.container.d/50-nice-dns-caps.conf.
#
# The image starts as the pihole user, and pihole-FTL carries the file
# capability cap_net_bind_service. NET_BIND_SERVICE is all it needs, and
# with it added explicitly no-new-privileges holds: :53 and :80 bind
# (Sub-plan 4 Task 2.1, podman 5.8.1). NoNewPrivileges without the explicit
# AddCapability does not: pihole-FTL then fails to bind :53.
[Container]
DropCapability=all
AddCapability=NET_BIND_SERVICE
NoNewPrivileges=true
