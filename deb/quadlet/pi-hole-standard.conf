# Drop-in for pi-hole.container with the standard image (pihole/Containerfile
# on the upstream pihole/pihole base); installed by persistent-podman.sh as
# pi-hole.container.d/50-nice-dns-caps.conf.
#
# The proven minimum (Sub-plan 4 Task 2.1, podman 5.8.1, with :53 and :80
# bound): the root entrypoint chowns its state (CHOWN, DAC_OVERRIDE, FOWNER),
# setcaps pihole-FTL (SETFCAP), drops to the pihole user through capsh
# (SETUID, SETGID, SETPCAP) and signals pihole-FTL on stop (KILL); pihole-FTL
# binds :53 and :80 (NET_BIND_SERVICE). Without DAC_OVERRIDE and FOWNER the
# entrypoint fails on /etc/pihole. Dropped from podman's default set: FSETID
# and SYS_CHROOT.
[Container]
DropCapability=all
AddCapability=CHOWN DAC_OVERRIDE FOWNER KILL NET_BIND_SERVICE SETFCAP SETGID SETPCAP SETUID
